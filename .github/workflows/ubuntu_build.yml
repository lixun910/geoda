# This is a basic workflow to help you get started with Actions

name: Ubuntu builds

# Controls when the action will run.
on:
  # Triggers the workflow on push only for the master branch
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/README.md'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  ubuntu_build:
    # The type of runner that the job will run on
    runs-on: ${{ matrix.distro }}
    if: ${{ !contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]') }}

    strategy:
      fail-fast: true
      matrix:
        distro:
          - 'ubuntu-24.04'
          - 'ubuntu-22.04'
        include:
          - distro: 'ubuntu-24.04'
            pre: 'noble'
            webkit: 'libwebkit2gtk-4.1-dev'
            wx: 'libwxgtk3.2-dev libwxgtk-webview3.2-dev'
          - distro: 'ubuntu-22.04'
            pre: 'jammy'
            webkit: 'libwebkit2gtk-4.0-dev'
            wx: 'libwxgtk3.0-gtk3-dev libwxgtk-webview3.0-gtk3-dev'

    env:
      platform: ${{ matrix.distro }}
      GEODA_VER: '1.22.0'
      TARGET_OS: ${{ matrix.pre }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Install dependencies on ${{ matrix.distro }}
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y ca-certificates
          sudo apt-get install -y cmake ninja-build build-essential
          sudo apt-get install -y ${{ matrix.wx }}
          sudo apt-get install -y libgdal-dev
          sudo apt-get install -y libboost-all-dev
          sudo apt-get install -y libeigen3-dev
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev
          sudo apt-get install -y libcurl4-openssl-dev
          sudo apt-get install -y ${{ matrix.webkit }}

      - name: Build GeoDa
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGEODA_USE_CLAPACK_EXTERNAL=ON
          cmake --build build

      - name: Package deb
        run: |
          # create_deb.sh expects the binary + runtime data in BuildTools/ubuntu/build
          mkdir -p BuildTools/ubuntu/build
          cp -R build/bin/* BuildTools/ubuntu/build/
          cd BuildTools/ubuntu
          ./create_deb.sh ${{ env.TARGET_OS }} ${{ env.GEODA_VER }}

      # Upload artifact
      - uses: actions/upload-artifact@v4
        with:
          name: GeoDa-${{ env.GEODA_VER }}-${{ env.TARGET_OS }}
          path: ${{ github.workspace }}/BuildTools/ubuntu/geoda_${{ env.GEODA_VER }}-1${{ env.TARGET_OS }}1_amd64.deb
