# This is a basic workflow to help you get started with Actions

name: Windows builds

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/README.md'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  windows_build:
    # The type of runner that the job will run on
    runs-on: windows-2022
    if: ${{ !contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]') }}

    strategy:
      matrix:
        include:
          - VS_VERSION: Visual Studio 17
            VS_VER: 2022
            MSVC_VER: 1930
            platform: x64
          - VS_VERSION: Visual Studio 17
            VS_VER: 2022
            MSVC_VER: 1930
            platform: x86

    env:
      VS_VERSION: ${{ matrix.VS_VERSION }}
      VS_VER: ${{ matrix.VS_VER }}
      MSVC_VER: ${{ matrix.MSVC_VER }}
      platform: ${{ matrix.platform }}
      APPVEYOR: true # to skip some tests
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true # see https://github.blog/changelog/2020-10-01-github-actions-deprecating-set-env-and-add-path-commands/

    # Steps represent a sequence of tasks that will be executed as part of the job

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Set environment
      - name: Set environment
        shell: pwsh
        run: |
          if($env:platform -eq "x86")
          {
              $env:ARCHITECTURE="x86"
              $env:WIN64_ARG=""
              $env:CMAKE_ARCHITECTURE="Win32"
          }
          else
          {
              $env:ARCHITECTURE="amd64"
              $env:WIN64_ARG="WIN64=YES"
              $env:CMAKE_ARCHITECTURE="x64"
          }
          # Persist across steps via $GITHUB_ENV (the old ::set-env command
          # was removed from GitHub Actions).
          "ARCHITECTURE=$env:ARCHITECTURE" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WIN64_ARG=$env:WIN64_ARG" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CMAKE_ARCHITECTURE=$env:CMAKE_ARCHITECTURE" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Set compiler environment
      - name: Set compiler environment
        shell: cmd
        run: |
          if "%VS_VER%" == "2022" CALL "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=%ARCHITECTURE%
          echo PATH=%PATH% >> %GITHUB_ENV%
          echo INCLUDE=%INCLUDE% >> %GITHUB_ENV%
          echo LIB=%LIB% >> %GITHUB_ENV%
          echo LIBPATH=%LIBPATH% >> %GITHUB_ENV%

      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            BuildTools/windows/libraries
            BuildTools/windows/temp
          key: ${{ runner.os }}-${{ matrix.platform }}-deps-cache-${{ hashFiles('BuildTools/windows/deps.md') }}

      # Install innosetup
      - name: Install innosetup
        uses: crazy-max/ghaction-chocolatey@v3
        with:
          args: install innosetup --no-progress

      # Create Deps
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Create Dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'continue'
          function exec
          {
            param ( [ScriptBlock] $ScriptBlock )
            & $ScriptBlock 2>&1 | ForEach-Object -Process { "$_" }
            if ($LastExitCode -ne 0) { exit $LastExitCode }
          }
          echo "ARCH_FLAGS = $env:ARCH_FLAGS"
          Import-PackageProvider NuGet -Force
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          # install pscx powershell and vSSetup
          Install-Module Pscx -AllowClobber
          Install-Module VSSetup -Scope CurrentUser
          if($env:VS_VER -eq "2022")
          {
            # Set up the MSVC build environment directly. Relying on the
            # GITHUB_ENV propagation from the "Set compiler environment" step
            # is not reliable for the long LIB/INCLUDE values, and VsDevCmd.bat
            # emits some Windows Kits paths with doubled separators (e.g.
            # ...\10\\lib\\10.0.26100.0\\um\\x64) which the MSVC linker rejects
            # when searching for kernel32.lib. Re-run VsDevCmd here and
            # normalize the paths before building wxWidgets.
            cmd /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat`" -arch=$env:ARCHITECTURE >nul 2>&1 && set" | ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') {
                Set-Item -Path "Env:$($matches[1])" -Value $matches[2]
              }
            }
          }
          else
          {
              Import-VisualStudioVars -VisualStudioVersion $env:VS_VER -Architecture $env:ARCHITECTURE
          }
          # Normalize doubled separators in the MSVC env vars (see above).
          if ($env:LIB) { $env:LIB = $env:LIB -replace '\\\\', '\' }
          if ($env:INCLUDE) { $env:INCLUDE = $env:INCLUDE -replace '\\\\', '\' }
          if ($env:PATH) { $env:PATH = $env:PATH -replace '\\\\', '\' }
          Write-Output "After env setup: LIB=$env:LIB"
          Write-Output "After env setup: INCLUDE=$env:INCLUDE"
          #
          # prepare
          #
          $env:GDA_PATH="$env:GITHUB_WORKSPACE\BuildTools\windows"
          cd $env:GDA_PATH
          mkdir temp
          #
          # GDAL # gisinternals SDK version still to 2016
          #
          if($env:platform -eq "x86")
          {
            $env:GDAL_SDK_VER="release-1911"
          }
          else
          {
            $env:GDAL_SDK_VER="release-1911-x64"
          }
          cd temp
          Invoke-WebRequest "https://github.com/GeoDaCenter/software/releases/download/v2000/$env:GDAL_SDK_VER-dev.zip" -OutFile "$env:GDAL_SDK_VER.zip"
          cd ..
          7z x .\temp\$env:GDAL_SDK_VER.zip
          dir
          Rename-Item $env:GDAL_SDK_VER libraries
          cd temp
          #
          # wxWidgets 3.1.4 (non-monolithic so FindwxWidgets can resolve components)
          #
          if(-Not (Test-Path -Path wxWidgets.zip)) { Invoke-WebRequest "https://github.com/wxWidgets/wxWidgets/releases/download/v3.1.4/wxWidgets-3.1.4.zip" -OutFile "wxWidgets.zip" }
          7z x wxWidgets.zip -owxWidgets
          cd wxWidgets
          xcopy /E /Y $env:GDA_PATH\dep\wxWidgets .
          cd build\msw
          Write-Output "wxWidgets build env: LIB=$env:LIB"
          Write-Output "wxWidgets build env: INCLUDE=$env:INCLUDE"
          if($env:platform -eq "x86")
          {
            nmake -f makefile.vc UNICODE=1 SHARED=1 RUNTIME_LIBS=dynamic BUILD=release MONOLITHIC=0 USE_OPENGL=1 USE_POSTSCRIPT=1
          }
          else
          {
            nmake -f makefile.vc UNICODE=1 SHARED=1 RUNTIME_LIBS=dynamic BUILD=release MONOLITHIC=0 USE_OPENGL=1 USE_POSTSCRIPT=1 TARGET_CPU=AMD64
          }
          cd $env:GDA_PATH\temp
          #
          # Boost 1.75
          #
          Invoke-WebRequest "https://github.com/lixun910/pygeoda_boost/archive/refs/tags/v1.18.zip" -OutFile "boost.zip"
          7z x boost.zip
          Rename-Item pygeoda_boost-1.18 boost
          #
          # CLAPACK 3.1.1
          #
          Invoke-WebRequest "https://github.com/GeoDaCenter/software/releases/download/v2000/CLAPACK-3.1.1-VisualStudio.zip" -OutFile "CLAPACK-3.1.1-VisualStudio.zip"
          7z x CLAPACK-3.1.1-VisualStudio.zip
          cd CLAPACK-3.1.1-VisualStudio
          xcopy /E /Y $env:GDA_PATH\dep\CLAPACK-3.1.1-VisualStudio .
          if($env:platform -eq "x86")
          {
            msbuild.exe clapack_vs2019.sln /t:libf2c_vs2019 /property:Configuration="ReleaseDLL"  /p:Platform="Win32"
            msbuild.exe clapack_vs2019.sln /t:BLAS\blas_vs2019 /property:Configuration="ReleaseDLL" /p:Platform="Win32"
            msbuild.exe clapack_vs2019.sln /t:clapack_vs2019 /property:Configuration="ReleaseDLL" /p:Platform="Win32"
          }
          else
          {
            msbuild.exe clapack_vs2019.sln /t:libf2c_vs2019 /property:Configuration="ReleaseDLL" /p:Platform="x64"
            msbuild.exe clapack_vs2019.sln /t:BLAS\blas_vs2019 /property:Configuration="ReleaseDLL" /p:Platform="x64"
            msbuild.exe clapack_vs2019.sln /t:clapack_vs2019 /property:Configuration="ReleaseDLL" /p:Platform="x64"
          }
          cd ..
          #
          # Eigen3
          #
          Invoke-WebRequest "https://github.com/GeoDaCenter/software/releases/download/v2000/eigen3.zip" -OutFile "eigen3.zip"
          7z x eigen3.zip
          #
          # OpenCL
          #
          Invoke-WebRequest "https://github.com/GeoDaCenter/software/releases/download/v2000/OpenCL.zip" -OutFile "OpenCL.zip"
          7z x OpenCL.zip
          dir
          cd ..

      # Build GeoDa
      - name: Build GeoDa
        shell: pwsh
        run: |
          function exec
          {
            param ( [ScriptBlock] $ScriptBlock )
            & $ScriptBlock 2>&1 | ForEach-Object -Process { "$_" }
            if ($LastExitCode -ne 0) { exit $LastExitCode }
          }
          echo "ARCH_FLAGS = $env:ARCH_FLAGS"
          Import-PackageProvider NuGet -Force
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          # install pscx powershell and vSSetup
          Install-Module Pscx -AllowClobber
          Install-Module VSSetup -Scope CurrentUser
          if($env:VS_VER -eq "2022")
          {
          }
          else
          {
              Import-VisualStudioVars -VisualStudioVersion $env:VS_VER -Architecture $env:ARCHITECTURE
          }
          $ErrorActionPreference = 'continue'
          $env:GDA_PATH="$env:GITHUB_WORKSPACE\BuildTools\windows"
          cd $env:GDA_PATH
          if($env:platform -eq "x86")
          {
            $env:OPENCL_LIB="$env:GDA_PATH\temp\OpenCL\sdk\lib\x86\OpenCL.lib"
            $env:CLAPACK_LIB="$env:GDA_PATH\temp\CLAPACK-3.1.1-VisualStudio\LIB\Win32"
            $env:BOOST_LIB="$env:GDA_PATH\temp\boost\lib\win32"
          }
          else
          {
            $env:OPENCL_LIB="$env:GDA_PATH\temp\OpenCL\sdk\lib\x64\OpenCL.lib"
            $env:CLAPACK_LIB="$env:GDA_PATH\temp\CLAPACK-3.1.1-VisualStudio\LIB\x64"
            $env:BOOST_LIB="$env:GDA_PATH\temp\boost\lib\win64"
          }
          # libcurl comes from the gisinternals GDAL SDK (bundled in the
          # release-1911-x64-dev.zip extracted to BuildTools/windows/libraries).
          cmake -S $env:GITHUB_WORKSPACE -B $env:GITHUB_WORKSPACE\build -A $env:CMAKE_ARCHITECTURE `
            -DCMAKE_BUILD_TYPE=Release `
            -DwxWidgets_ROOT_DIR="$env:GDA_PATH\temp\wxWidgets" `
            -DGEODA_CLAPACK_PATH="$env:CLAPACK_LIB" `
            -DBoost_ROOT="$env:GDA_PATH\temp\boost" `
            -DBoost_LIBRARY_DIR="$env:BOOST_LIB" `
            -DBoost_COMPILER=-vc142 `
            -DGDAL_ROOT="$env:GDA_PATH\libraries" `
            -DEIGEN3_INCLUDE_DIR="$env:GDA_PATH\temp\eigen3" `
            -DOpenCL_INCLUDE_DIR="$env:GDA_PATH\temp\OpenCL\sdk\include" `
            -DOpenCL_LIBRARY="$env:OPENCL_LIB" `
            -DCURL_INCLUDE_DIR="$env:GDA_PATH\libraries\include" `
            -DCURL_LIBRARY="$env:GDA_PATH\libraries\lib\libcurl_imp.lib" `
            -DZLIB_INCLUDE_DIR="$env:GDA_PATH\libraries\include" `
            -DZLIB_LIBRARY="$env:GDA_PATH\libraries\lib\zlib.lib"
          cmake --build $env:GITHUB_WORKSPACE\build --config Release
          # The InnoSetup scripts (installer\{32,64}bit\*.iss) reference the exe
          # at ..\..\Release\GeoDa.exe (the legacy GNUmake/MSVC output location).
          # The CMake build emits to build\Release\, so copy it to where the
          # installer scripts expect it.
          New-Item -ItemType Directory -Force -Path "$env:GDA_PATH\Release" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\build\Release\GeoDa.exe" "$env:GDA_PATH\Release\GeoDa.exe" -Force
          # update installer version numbers in iss files
          python update_installer_version.py
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Failed to update installer version numbers, continuing with build..."
          }
          if($env:platform -eq "x86")
          {
            ISCC.exe /q installer\32bit\GeoDa.iss
            ISCC.exe /q installer\32bit\GeoDa-win7+.iss
          }
          else
          {
            ISCC.exe /q installer\64bit\GeoDa.iss
            ISCC.exe /q installer\64bit\GeoDa-win7+.iss
          }

      - uses: actions/upload-artifact@v4
        with:
          name: GeoDa-Windows-${{ env.platform }}-installer
          path: ${{ github.workspace }}\BuildTools\windows\GeoDa_1.22_${{ env.platform }}_Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: GeoDa-Windows7+-${{ env.platform }}-installer
          path: ${{ github.workspace }}\BuildTools\windows\GeoDa_1.22_win7+${{ env.platform }}_Setup.exe
